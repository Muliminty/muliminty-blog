version: '3.8'

services:
  # Next.js 应用
  blog:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 构建时传入环境变量（可选）
        GITHUB_TOKEN: ${GITHUB_TOKEN}
        GITHUB_OWNER: ${GITHUB_OWNER}
        GITHUB_REPO: ${GITHUB_REPO}
    container_name: muliminty-blog
    restart: unless-stopped
    environment:
      # 运行时环境变量
      - NODE_ENV=production
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - GITHUB_OWNER=${GITHUB_OWNER}
      - GITHUB_REPO=${GITHUB_REPO}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    ports:
      - "3000:3000"
    networks:
      - blog-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: muliminty-blog-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL 证书（如果有）
      # - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - blog
    networks:
      - blog-network

networks:
  blog-network:
    driver: bridge
